name: Deploy Frontend

# Builds the Nuxt SPA and deploys it to Cloudflare as an assets-only Worker.
# The backend is deployed separately (docker/release.Dockerfile) — this workflow
# only ships the frontend.
#
# Required repository secrets:
#   CLOUDFLARE_API_TOKEN   - token with Workers Scripts:Edit (+ Workers Routes /
#                            Zone:Edit if the route in wrangler.toml is managed here)
#   CLOUDFLARE_ACCOUNT_ID  - the Cloudflare account the Worker belongs to

on:
  push:
    branches: [main]
    # Only rebuild when something that affects the SPA changes.
    paths:
      - 'frontend/**'
      - 'nuxt.config.ts'
      - 'tailwind.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'wrangler.toml'
  workflow_dispatch:

# Prevent overlapping deploys; let an in-progress run finish rather than cancel.
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SPA
        # ssr:false generate — no backend secrets needed at build time. Pin the
        # base URL and API path explicitly so the build never depends on the
        # `npm run build` default (which points the API at /api).
        run: npm run build:frontend
        env:
          NUXT_APP_BASE_URL: /app/
          NUXT_PUBLIC_API_URL: /app/api

      - name: Stage assets under /app
        # Nuxt emits flat files (_nuxt/…) but the HTML references them at
        # /app/_nuxt/… (base URL /app/). Relocate the output under dist/app/ so
        # the Worker serves each file at the path its HTML expects, and copy the
        # SPA shell to dist/index.html for the not-found fallback.
        run: |
          rm -rf dist
          mkdir -p dist/app
          cp -r .output/public/. dist/app/
          cp .output/public/200.html dist/index.html

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_WORKER_DEPLOY_TOKEN }}
          accountId: ${{ secrets.CF_WORKER_DEPLOY_ACCOUNT_ID }}
          command: deploy
