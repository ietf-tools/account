  state: present
- attrs:
    execution_logging: false
    expression: "# Keep in step with BLOCKED_EMAIL_DOMAINS in the app's .env \u2014\
      \ see this\n# blueprint's header. Bare hostnames, lower-case, no leading \"\
      @\". Matched\n# exactly: subdomains are NOT implied, list them if you want them\
      \ blocked.\nBLOCKED_EMAIL_DOMAINS = [\"ietf.org\"]\n\nprompt_data = request.context.get(\"\
      prompt_data\") or {}\nemail = (prompt_data.get(\"email\") or \"\").strip().lower()\n\
      if not email:\n    # Social enrollment seeds prompt_data from the source before\
      \ the flow\n    # runs; should some source path ever not, fall back to the pending\
      \ user\n    # the source flow manager built.\n    pending = request.context.get(\"\
      pending_user\")\n    email = (getattr(pending, \"email\", \"\") or \"\").strip().lower()\n\
      \n# No address to judge \u2014 not this policy's call to make. The sign-up form\n\
      # requires one, and a source that supplies none can't be supplying a blocked\n\
      # one either.\nhost = email.rpartition(\"@\")[2].rstrip(\".\")\nif not host:\n\
      \    return True\n\nif host in BLOCKED_EMAIL_DOMAINS:\n    ak_message(\n   \
      \     f\"Addresses at {host} cannot be used for an IETF account. \"\n      \
      \  \"Please use a personal address you will keep long-term.\"\n    )\n    return\
      \ False\nreturn True"
    name: ietf-enrollment-allow-email-domain
  conditions: []
  identifiers:
    pk: d86169b1-4489-4d02-a64d-f7856359776c
  model: authentik_policies_expression.expressionpolicy
  permissions: []
  state: present
