    negate: false
    timeout: 30
    user: null
  conditions: []
  identifiers:
    order: 0
    pk: 712b9538-dafc-4482-bb71-0385ff353fdb
    policy: 2e4335c4-865c-4815-be49-b52f1cb8bbe2
    target: ed80e26f-7013-40c9-be22-6b5fdcefefd2
  model: authentik_policies.policybinding
  permissions: []
  state: present
- attrs:
    evaluate_on_plan: false
    invalid_response_action: retry
    policy_engine_mode: any
    re_evaluate_policies: true
  conditions: []
  identifiers:
    order: 2
    pk: 5774f1b1-800f-4348-aead-16e517021cd1
    stage: eced5d6c-bf07-47c3-becb-6d7236ea9918
    target: 4a517065-bb38-4f10-a6e6-7cae20778535
  model: authentik_flows.flowstagebinding
  permissions: []
  state: present
- attrs:
    enabled: true
    failure_result: false
    group: null
    negate: false
    timeout: 30
    user: null
  conditions: []
  identifiers:
    order: 0
    pk: e17aefbe-f72d-4608-aba5-0c58b6d48c23
    policy: bcee96e9-9935-4fa2-9e61-643ce464b86a
    target: 5774f1b1-800f-4348-aead-16e517021cd1
  model: authentik_policies.policybinding
  permissions: []
